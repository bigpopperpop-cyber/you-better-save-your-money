
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#059669">
    <title>Money Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --app-height: 100dvh;
      }
      html, body {
        height: var(--app-height);
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f0fdf4; /* emerald-50 */
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
        position: fixed;
        width: 100%;
        overscroll-behavior: none;
        /* Money Theme Pattern */
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, rgba(240, 253, 244, 0.4) 100%),
          url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23059669' fill-opacity='0.03' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM24 30V24h-2v6h-6v2h6v6h2v-6h6v-2h-6zM6 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 50a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM30 34a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm30 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM54 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM18 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM42 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'/%3E%3C/g%3E%3C/svg%3E");
      }
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: white !important; }
      }
      .print-only { display: none; }
      
      .tab-content {
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .ios-tap:active {
        transform: scale(0.96);
        opacity: 0.8;
      }
      
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Handling limited vertical space in landscape */
      @media (max-height: 500px) and (orientation: landscape) {
        .landscape-compact-nav {
          height: 54px !important;
          bottom: 8px !important;
          padding-left: 20px !important;
          padding-right: 20px !important;
          border-radius: 1.5rem !important;
        }
        .landscape-compact-nav svg {
          width: 20px !important;
          height: 20px !important;
        }
        .landscape-compact-nav span {
          display: none;
        }
        .landscape-compact-nav .plus-btn {
          margin-top: -24px !important;
          padding: 8px !important;
          border-radius: 1.2rem !important;
        }
        .landscape-compact-nav .plus-btn svg {
          width: 24px !important;
          height: 24px !important;
        }
        header.md\:hidden {
          padding-top: max(8px, env(safe-area-inset-top)) !important;
          padding-bottom: 8px !important;
        }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom": "https://esm.sh/@esm-bundle/react-dom@19.0.0",
        "react-dom/": "https://esm.sh/@esm-bundle/react-dom@19.0.0/",
        "@google/genai": "https://esm.sh/@google/genai@1.41.0",
        "recharts": "https://esm.sh/recharts@2.15.0",
        "lucide-react": "https://esm.sh/lucide-react@0.454.0",
        "react-is": "https://esm.sh/react-is@19.0.0",
        "prop-types": "https://esm.sh/prop-types@15.8.1"
      }
    }
    </script>
  </head>
  <body class="overscroll-none select-none">
    <div id="root" class="h-full"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
